<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1e63b8">
<title>HỌC THI CÙNG DMD</title>
<style>
:root{
  --bg:#f3f8ff;--line:#b9d4f5;--title:#1e63b8;--chip:#eef5ff;--chip-line:#d4e5fa;--chip-hover:#dcebff;
  --text:#1f2d3d;--muted:#6b86a8;--ok:#1f9d63;--okbg:#e6f7ef;--bad:#d64545;--badbg:#fdeceb;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font-family:inherit}
.top{background:#fff;border-bottom:1.5px solid var(--line);position:sticky;top:0;z-index:5}
.top-in{max-width:960px;margin:0 auto;padding:10px 16px 6px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:800;font-size:18px;color:var(--title);text-transform:uppercase;letter-spacing:.04em}
.pill{max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid var(--chip-line);background:var(--chip);color:var(--title);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
nav{max-width:960px;margin:0 auto;display:flex;gap:6px;padding:4px 12px 10px;overflow-x:auto}
nav button{flex:none;border:1px solid var(--chip-line);background:var(--chip);color:var(--title);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer}
nav button.on{background:var(--title);color:#fff;border-color:var(--title)}
.wrap{width:100%;max-width:960px;margin:0 auto;padding:20px 16px 40px;flex:1 0 auto}
.foot{width:100%;max-width:960px;margin:0 auto;padding:12px 16px 18px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:9pt;font-style:italic;color:#8a8f98;border-top:1px solid var(--chip-line)}
.foot .l{text-transform:uppercase;text-align:left}
.foot .r{text-align:right;white-space:nowrap}
h2{margin:0 0 6px;font-size:22px;color:var(--title)}
.muted{color:var(--muted);font-size:14px}
.center{text-align:center}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1.5px solid var(--title);background:var(--title);color:#fff;border-radius:999px;padding:10px 20px;font-size:15px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:#fff;color:var(--title)}
.btn.danger{background:#fff;border-color:var(--bad);color:var(--bad)}
.btn.small{padding:6px 14px;font-size:14px}
.btn.off{opacity:.45;pointer-events:none}
fieldset{margin:0 0 22px;padding:16px;background:#fff;border:1.5px solid var(--line);border-radius:16px;min-width:0}
legend{margin-left:8px;padding:0 10px;font-size:17px;font-weight:700;color:var(--title)}
.card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.card.resume{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#e9f2ff}
.card.note{background:#fff8e6;border-color:#f0d58a}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:center;font-size:14px;color:var(--muted)}
.stat b{display:block;font-size:24px;color:var(--title)}
.cta{margin-bottom:22px}
.bar{height:8px;background:var(--chip-line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--title);border-radius:99px;transition:width .2s}
.grow{margin-bottom:14px}.grow:last-child{margin-bottom:0}
.gl{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.tag{display:inline-block;background:var(--chip);border:1px solid var(--chip-line);color:var(--title);border-radius:999px;padding:1px 10px;font-size:12px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 18px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.form label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--text);font-size:15px}
select,input[type=number]{padding:9px 10px;font-size:15px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--text)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--title)}
.grp{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:8px;background:var(--chip);border:1px solid var(--chip-line);border-radius:10px;cursor:pointer}
.grp .gn{flex:1;font-weight:600}
.avail{margin:4px 0 14px;font-weight:600;color:var(--title)}
/* quiz */
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0 14px;flex-wrap:wrap}
#timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--title)}
#timer.late{color:var(--bad)}
.qt{font-size:18px;font-weight:600;white-space:pre-line;margin-bottom:6px}
.hint{font-size:13px;color:var(--muted);margin-bottom:12px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;margin:0 0 10px;padding:12px 14px;background:var(--chip);border:1.5px solid var(--chip-line);border-radius:12px;font:inherit;color:inherit;cursor:pointer}
.opt:hover{background:var(--chip-hover)}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;background:#fff;border:1.5px solid var(--line);color:var(--title);display:grid;place-items:center;font-size:13px}
.opt span{white-space:pre-line;padding-top:2px}
.opt.sel{border-color:var(--title);background:#e3efff}
.opt.sel b{background:var(--title);border-color:var(--title);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad b{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.lock{pointer-events:none}
.expl{margin-top:10px;padding:10px 12px;background:#fff8e6;border:1px solid #f0d58a;border-radius:10px;font-size:15px;white-space:pre-line}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
.actions .sp{flex:1}
.qn{display:flex;flex-wrap:wrap;gap:6px}
.qn button{width:36px;height:34px;border-radius:8px;border:1.5px solid var(--chip-line);background:var(--chip);color:var(--title);font-size:13px;cursor:pointer}
.qn button.cur{border-color:var(--title);box-shadow:0 0 0 2px #1e63b833}
.qn button.ans{background:#cfe3ff}
.qn button.ok{background:var(--okbg);border-color:var(--ok)}
.qn button.bad{background:var(--badbg);border-color:var(--bad)}
/* result */
.score{font-size:54px;font-weight:800;color:var(--title);line-height:1.1}
details.rv{background:#fff;border:1.5px solid var(--line);border-radius:12px;margin-bottom:10px}
details.rv.ok{border-left:5px solid var(--ok)}
details.rv.bad{border-left:5px solid var(--bad)}
details.rv summary{cursor:pointer;padding:10px 12px;display:flex;gap:8px;align-items:flex-start}
details.rv .rq{white-space:pre-line;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rvb{padding:0 12px 12px}
.ro{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;margin-top:6px;background:var(--chip);border:1px solid var(--chip-line);border-radius:8px;font-size:15px}
.ro b{flex:none;color:var(--title)}
.ro span{flex:1;white-space:pre-line}
.ro em{font-style:normal;font-size:12px;border-radius:99px;padding:1px 8px;background:#fff;border:1px solid var(--line);color:var(--title)}
.ro.ok{background:var(--okbg);border-color:var(--ok)}
.ro.bad{background:var(--badbg);border-color:var(--bad)}
.bank{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;margin-bottom:8px;border:1px solid var(--chip-line);border-radius:10px;background:var(--chip)}
.bank.on{border-color:var(--title);background:#e3efff}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--chip-line)}
th{color:var(--muted);font-weight:600}
ul{margin:6px 0 0;padding-left:20px;font-size:14px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2d3d;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90%;text-align:center}
#toast.on{opacity:.95}
@media (max-width:520px){.wrap{padding:14px 12px 48px}.pill{max-width:55%}.score{font-size:44px}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in"><div class="brand">HỌC THI CÙNG DMD</div><button class="pill" id="pill"></button></div>
  <nav id="nav"></nav>
</header>
<main id="app" class="wrap"><p class="muted">Đang tải...</p></main>
<footer class="foot"><span class="l">DMD - TRADITIONALLY CONTEMPORARY</span><span class="r">GiangTN01</span></footer>
<div id="toast"></div>
<input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
<input type="file" id="restore" accept=".json,application/json" hidden>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
'use strict';
/* ====================== Tiện ích ====================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/\s+/g,' ').trim();
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = t => { t = Math.max(0, Math.round(t)); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60; return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(s).padStart(2,'0'); };
function hash(s){ let h1 = 0xdeadbeef, h2 = 0x41c6ce57; for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); } h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909); return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36); }
let toastT = 0;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3200); }
const LS = {
  get(k, d){ try { const v = localStorage.getItem('quiz.v1.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem('quiz.v1.' + k, JSON.stringify(v)); return true; } catch { toast('Không lưu được: bộ nhớ trình duyệt đầy hoặc đang bị chặn.'); return false; } },
  del(k){ try { localStorage.removeItem('quiz.v1.' + k); } catch {} }
};

/* ====================== Trạng thái ====================== */
const S = {
  view: 'home', mode: 'practice',
  banks: LS.get('banks', []), repo: null, active: LS.get('active', null),
  stats: LS.get('stats', {}), history: LS.get('history', []),
  cfg: Object.assign({ n: 20, filter: 'all', shQ: true, shO: true, minutes: 30, sel: {} }, LS.get('cfg', {})),
  session: LS.get('session', null), result: null, showAll: false, notice: null
};
const MAPS = new WeakMap();
const allBanks = () => (S.repo ? [S.repo] : []).concat(S.banks);
const getBank = id => allBanks().find(b => b.id === id);
const bank = () => getBank(S.active) || allBanks()[0] || null;
function qOf(b, id){ let m = MAPS.get(b); if (!m) { m = new Map(b.qs.map(q => [q.id, q])); MAPS.set(b, m); } return m.get(id); }
const isOk = (q, sel) => sel.length === q.a.length && q.a.every(i => sel.includes(i));
const st = b => S.stats[b.id] || (S.stats[b.id] = {});
function rec(b, id, ok){ const m = st(b); const r = m[id] || (m[id] = { n: 0, c: 0, w: 0, last: null, t: 0 }); r.n++; ok ? r.c++ : r.w++; r.last = ok ? 1 : 0; r.t = Date.now(); }
function groupsOf(b){ const g = new Map(); b.qs.forEach(q => { if (!g.has(q.g)) g.set(q.g, []); g.get(q.g).push(q); }); return g; }
function summary(b){ const m = st(b); let seen = 0, c = 0, n = 0, wrong = 0; b.qs.forEach(q => { const r = m[q.id]; if (r) { seen++; c += r.c; n += r.n; if (r.last === 0) wrong++; } }); return { total: b.qs.length, seen, acc: n ? Math.round(c * 100 / n) : 0, wrong }; }
const saveCfg = () => LS.set('cfg', S.cfg);
function selGroups(b){ const all = [...groupsOf(b).keys()]; const s = S.cfg.sel[b.id]; return s ? all.filter(g => s.includes(g)) : all; }
function pool(b){ const sel = new Set(selGroups(b)), m = st(b), f = S.cfg.filter; return b.qs.filter(q => sel.has(q.g) && (f === 'all' || (f === 'new' ? !m[q.id] : (m[q.id] && m[q.id].last === 0)))); }

/* ====================== Đọc file Excel ====================== */
function mapHeader(row){
  const c = { q: -1, g: -1, a: -1, e: -1, opts: [] };
  row.forEach((h, i) => {
    const n = norm(h); if (!n) return;
    const m = n.match(/^(?:dap an|lua chon|phuong an|option|choice|answer)?\s*[.:\-]?\s*([a-h])[.:)]?$/);
    if (m) { c.opts.push({ k: m[1].toUpperCase(), i }); return; }
    if (c.q < 0 && (n.includes('cau hoi') || n === 'question' || n === 'noi dung' || n.includes('de bai') || n === 'cau')) c.q = i;
    else if (c.g < 0 && /(^|\s)(nhom|chuyen de|chuong|group|chapter|topic|linh vuc|phan)(\s|$)/.test(n)) c.g = i;
    else if (c.a < 0 && (n === 'dap an' || n === 'dap an dung' || n === 'answer' || n === 'correct' || n === 'key' || n.includes('dap an dung'))) c.a = i;
    else if (c.e < 0 && /giai thich|explanation|loi giai|ghi chu|note/.test(n)) c.e = i;
  });
  return c;
}
function parseAnswer(raw, opts){
  const s = String(raw).trim(); if (!s) return [];
  const ns = norm(s);
  const ti = opts.findIndex(o => norm(o.t) === ns);
  if (ti >= 0) return [ti];
  const byK = k => opts.findIndex(o => o.k === k);
  const m = s.match(/^\s*([A-Ha-h])\s*[.):]\s+\S/);
  if (m) { const i = byK(m[1].toUpperCase()); if (i >= 0) return [i]; }
  const compact = s.toUpperCase().replace(/VÀ|AND|[\s,;|/+&.\-]/g, '');
  if (/^[A-H]+$/.test(compact)) { const idx = [...new Set([...compact])].map(byK); if (idx.every(i => i >= 0)) return idx.sort((a, b) => a - b); }
  if (/^[\d\s,;]+$/.test(s)) { const idx = s.split(/[\s,;]+/).filter(Boolean).map(n => byK('ABCDEFGH'[Number(n) - 1])); if (idx.length && idx.every(i => i >= 0)) return [...new Set(idx)].sort((a, b) => a - b); }
  return [];
}
function parseWorkbook(wb){
  const qs = [], warns = [], seen = new Map();
  wb.SheetNames.forEach(sn => {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: '', raw: false });
    let hi = -1, cols = null;
    for (let i = 0; i < Math.min(rows.length, 10); i++) { const c = mapHeader(rows[i]); if (c.q >= 0 && c.opts.length >= 2 && c.a >= 0) { hi = i; cols = c; break; } }
    if (hi < 0) { if (rows.length) warns.push(`Sheet "${sn}": không thấy dòng tiêu đề (cần các cột Câu hỏi, A, B, ..., Đáp án).`); return; }
    let lastG = sn;
    for (let r = hi + 1; r < rows.length; r++) {
      const row = rows[r];
      if (row.every(x => String(x).trim() === '')) continue;
      const qt = String(row[cols.q] ?? '').trim();
      const opts = cols.opts.map(o => ({ k: o.k, t: String(row[o.i] ?? '').trim() })).filter(o => o.t !== '');
      if (opts.length && opts.every(o => new RegExp('^' + o.k + '\\s*[.):]\\s+', 'i').test(o.t))) opts.forEach(o => { o.t = o.t.replace(new RegExp('^' + o.k + '\\s*[.):]\\s+', 'i'), ''); });
      const ans = parseAnswer(row[cols.a], opts);
      if (cols.g >= 0) { const g = String(row[cols.g] ?? '').trim(); if (g) lastG = g; }
      if (!qt || opts.length < 2 || !ans.length) { warns.push(`Sheet "${sn}", dòng ${r + 1}: thiếu câu hỏi/đáp án hoặc đáp án không khớp.`); continue; }
      let id = hash(norm(lastG + '|' + qt)); const d = seen.get(id) || 0; seen.set(id, d + 1); if (d) id += '_' + d;
      qs.push({ id, g: lastG, q: qt, o: opts.map(o => o.t), a: ans, e: cols.e >= 0 ? String(row[cols.e] ?? '').trim() : '' });
    }
  });
  return { qs, warns };
}
async function importFile(file){
  if (typeof XLSX === 'undefined') { toast('Chưa tải được thư viện đọc Excel. Kiểm tra mạng rồi tải lại trang.'); return; }
  let res;
  try { res = parseWorkbook(XLSX.read(await file.arrayBuffer(), { type: 'array' })); }
  catch { toast('Không đọc được file này. Hãy dùng .xlsx, .xls hoặc .csv.'); return; }
  const { qs, warns } = res;
  if (!qs.length) { S.notice = { title: 'Không nhập được câu hỏi nào từ file.', lines: warns.slice(0, 10) }; go('banks'); return; }
  const name = file.name.replace(/\.[^.]+$/, '');
  const id = 'u_' + hash(norm(name));
  const prev = S.banks;
  S.banks = prev.filter(b => b.id !== id).concat({ id, name, ts: Date.now(), qs });
  if (!LS.set('banks', S.banks)) { S.banks = prev; return; }
  S.active = id; LS.set('active', id);
  const gcount = new Set(qs.map(q => q.g)).size;
  if (warns.length) { S.notice = { title: `Đã nhập ${qs.length} câu (${gcount} nhóm). Bỏ qua ${warns.length} dòng lỗi:`, lines: warns.slice(0, 10).concat(warns.length > 10 ? ['...'] : []) }; go('banks'); }
  else { toast(`Đã nhập ${qs.length} câu, ${gcount} nhóm.`); go('home'); }
}
function downloadTemplate(){
  if (typeof XLSX === 'undefined') { toast('Chưa tải được thư viện Excel. Kiểm tra mạng rồi thử lại.'); return; }
  const rows = [
    ['Nhóm', 'Câu hỏi', 'A', 'B', 'C', 'D', 'Đáp án', 'Giải thích'],
    ['Chuyên đề 1', 'Thủ đô của Việt Nam là gì?', 'Hà Nội', 'Huế', 'Đà Nẵng', 'TP. Hồ Chí Minh', 'A', 'Hà Nội là thủ đô của Việt Nam.'],
    ['Chuyên đề 1', 'Những số nào sau đây là số chẵn? (chọn nhiều đáp án)', '1', '2', '3', '4', 'B,D', ''],
    ['Chuyên đề 2', 'Trái Đất quay quanh Mặt Trời.', 'Đúng', 'Sai', '', '', 'A', '']
  ];
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{ wch: 14 }, { wch: 52 }, { wch: 22 }, { wch: 22 }, { wch: 22 }, { wch: 22 }, { wch: 10 }, { wch: 40 }];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Cau hoi');
  XLSX.writeFile(wb, 'mau-cau-hoi.xlsx');
}
async function loadRepo(){
  if (typeof XLSX === 'undefined') return;
  try {
    const r = await fetch('questions.xlsx?' + Date.now()); if (!r.ok) return;
    const { qs } = parseWorkbook(XLSX.read(await r.arrayBuffer(), { type: 'array' }));
    if (qs.length) S.repo = { id: 'repo', name: 'Bộ câu hỏi chung', qs, ts: 0, repo: true };
  } catch {}
}

/* ====================== Phiên làm bài ====================== */
const PIN = /^(tat ca|ca [a-h]\b|ca hai|ca ba|khong (co )?(dap an|cai nao|y nao)|all of the above|none of the above)/;
function orderFor(q, sh){
  const idx = q.o.map((_, i) => i); if (!sh) return idx;
  const pin = idx.filter(i => PIN.test(norm(q.o[i])));
  return shuffle(idx.filter(i => !pin.includes(i))).concat(pin);
}
const elapsedNow = () => { const s = S.session; return s.elapsed + (s.t0 ? (Date.now() - s.t0) / 1000 : 0); };
function persistSession(){ const s = S.session; if (!s) return; if (s.t0) { s.elapsed = elapsedNow(); s.t0 = Date.now(); } LS.set('session', s); }
function pauseSession(){ const s = S.session; if (!s) return; s.elapsed = elapsedNow(); s.t0 = 0; LS.set('session', s); }
function clearSession(){ S.session = null; LS.del('session'); }
function startSession(b, qs, o){
  const list = S.cfg.shQ ? shuffle(qs) : qs.slice();
  S.session = {
    bank: b.id, mode: o.mode, idx: 0, elapsed: 0, t0: Date.now(), start: Date.now(),
    limit: o.mode === 'exam' ? Math.max(0, Number(o.minutes) || 0) * 60 : 0, groups: o.groups || [],
    items: list.map(q => ({ id: q.id, order: orderFor(q, S.cfg.shO), sel: [], done: false, ok: null }))
  };
  persistSession(); S.view = 'quiz'; render(); window.scrollTo(0, 0);
}
function startFromSetup(){
  const b = bank(), p = pool(b);
  if (!p.length) { toast('Không có câu hỏi nào phù hợp với lựa chọn.'); return; }
  if (S.session && !confirm('Đang có một bài làm dở. Bắt đầu bài mới sẽ xóa bài đó. Tiếp tục?')) return;
  const n = S.cfg.n;
  const picked = (n && n < p.length) ? (S.cfg.shQ ? shuffle(p).slice(0, n) : p.slice(0, n)) : p;
  startSession(b, picked, { mode: S.mode, minutes: S.cfg.minutes, groups: selGroups(b) });
}
function curItem(){ const s = S.session, b = getBank(s.bank), it = s.items[s.idx]; return { s, b, it, q: qOf(b, it.id) }; }
function pick(oi){
  const { s, it, q } = curItem();
  if (s.mode === 'practice' && it.done) return;
  const multi = q.a.length > 1;
  if (multi) { const i = it.sel.indexOf(oi); i >= 0 ? it.sel.splice(i, 1) : it.sel.push(oi); }
  else it.sel = (s.mode === 'exam' && it.sel[0] === oi) ? [] : [oi];
  persistSession();
  if (s.mode === 'practice' && !multi) check(); else render();
}
function check(){
  const { b, it, q } = curItem();
  if (it.done) return;
  if (!it.sel.length) { toast('Hãy chọn đáp án trước.'); return; }
  it.ok = isOk(q, it.sel); it.done = true; rec(b, q.id, it.ok);
  LS.set('stats', S.stats); persistSession(); render();
}
function move(d){ const s = S.session, n = s.idx + d; if (n < 0 || n >= s.items.length) return; s.idx = n; persistSession(); render(); window.scrollTo(0, 0); }
function jump(i){ S.session.idx = i; persistSession(); render(); window.scrollTo(0, 0); }
function finish(){
  const s = S.session, b = getBank(s.bank);
  let c = 0, w = 0, bl = 0; const rows = [];
  s.items.forEach(it => {
    const q = qOf(b, it.id), ok = it.sel.length > 0 && isOk(q, it.sel);
    if (it.sel.length && !it.done) rec(b, q.id, ok);
    if (!it.sel.length) bl++; else if (ok) c++; else w++;
    rows.push({ id: it.id, sel: it.sel, order: it.order, ok, blank: !it.sel.length });
  });
  const total = s.items.length, secs = Math.round(elapsedNow());
  const res = { bank: b.id, mode: s.mode, total, c, w, bl, secs, pct: total ? Math.round(c * 100 / total) : 0, rows, ts: Date.now() };
  S.history.unshift({ ts: res.ts, bank: b.id, bankName: b.name, mode: s.mode, total, c, w, bl, secs });
  S.history = S.history.slice(0, 200);
  LS.set('stats', S.stats); LS.set('history', S.history); clearSession();
  S.result = res; S.showAll = false; S.view = 'result'; render(); window.scrollTo(0, 0);
}
function validateSession(){
  const s = S.session; if (!s) return;
  const b = getBank(s.bank);
  if (!b) return clearSession();
  s.items = s.items.filter(it => qOf(b, it.id));
  if (!s.items.length) return clearSession();
  s.idx = Math.min(s.idx, s.items.length - 1); s.t0 = 0;
}

const NAV = [['home','Trang chủ'],['practice','Luyện tập'],['exam','Thi thử'],['review','Cần ôn lại'],['history','Kết quả'],['banks','Bộ câu hỏi']];
let timerId = 0;
function go(v, mode){
  if (S.view === 'quiz' && S.session) pauseSession();
  if (v !== 'banks') S.notice = null;
  S.view = v; if (mode) S.mode = mode;
  render(); window.scrollTo(0, 0);
}
function renderNav(){
  const b = bank(), wrong = b ? summary(b).wrong : 0, cur = S.view === 'setup' ? S.mode : S.view;
  $('#nav').innerHTML = NAV.map(([k, l]) => `<button data-nav="${k}" class="${cur === k ? 'on' : ''}">${l}${k === 'review' && wrong ? ' (' + wrong + ')' : ''}</button>`).join('');
  $('#pill').textContent = b ? `${b.name} · ${b.qs.length} câu` : 'Chưa có bộ câu hỏi';
}
function render(){
  clearInterval(timerId);
  renderNav();
  const b = bank(), app = $('#app'), y = window.scrollY;
  let h = '';
  if (S.view === 'banks') h = viewBanks();
  else if (!b) h = viewEmpty();
  else if (S.view === 'quiz' && S.session) h = viewQuiz();
  else if (S.view === 'result' && S.result) h = viewResult();
  else if (S.view === 'setup') h = viewSetup(b);
  else if (S.view === 'review') h = viewReview(b);
  else if (S.view === 'history') h = viewHistory();
  else { S.view = 'home'; h = viewHome(b); }
  app.innerHTML = h;
  if (S.view === 'quiz') { startTimer(); window.scrollTo(0, y); }
  if (S.view === 'setup') updAvail();
}
function viewEmpty(){
  return `<div class="card center"><h2>Chưa có bộ câu hỏi</h2><p class="muted">Nhập file Excel chứa câu hỏi để bắt đầu. Chưa có file? Tải file mẫu về, điền câu hỏi rồi nhập lại.</p><div class="row" style="justify-content:center"><button class="btn" data-act="pickfile">Chọn file Excel</button><button class="btn ghost" data-act="template">Tải file mẫu</button></div></div>`;
}

  h += `<div class="row cta"><button class="btn" data-act="go" data-v="practice">Luyện tập</button><button class="btn" data-act="go" data-v="exam">Thi thử</button><button class="btn ghost" data-act="go" data-v="review">Ôn câu sai (${sm.wrong})</button></div>`;
  h += `<fieldset><legend>Tiến độ theo nhóm</legend>${[...gs].map(([g, list]) => {
    let seen = 0, c = 0, n = 0; list.forEach(q => { const r = m[q.id]; if (r) { seen++; c += r.c; n += r.n; } });
    return `<div class="grow"><div class="gl"><b>${esc(g)}</b><span class="muted">${seen}/${list.length} câu đã làm · đúng ${n ? Math.round(c * 100 / n) : 0}%</span></div><div class="bar"><i style="width:${Math.round(seen * 100 / list.length)}%"></i></div></div>`;
  }).join('')}</fieldset>`;
  return h;
}

    ${exam ? `<label>Thời gian (phút, 0 = không giới hạn)<input type="number" min="0" max="300" data-cfg="minutes" value="${Number(c.minutes) || 0}"></label>` : ''}
    <label class="chk"><input type="checkbox" data-cfg="shQ" ${c.shQ ? 'checked' : ''}>Xáo trộn thứ tự câu hỏi</label>
    <label class="chk"><input type="checkbox" data-cfg="shO" ${c.shO ? 'checked' : ''}>Xáo trộn các đáp án lựa chọn</label>
  </div></fieldset>
  <div class="avail" id="avail"></div>

function updAvail(){
  const el = $('#avail'); if (!el) return;
  const b = bank(), p = pool(b).length, n = S.cfg.n;
  el.textContent = p ? `Sẽ làm ${n && n < p ? n : p} câu (có ${p} câu phù hợp)` : 'Không có câu hỏi nào phù hợp với lựa chọn';
}
function viewQuiz(){
  const { s, it, q } = curItem(), total = s.items.length, exam = s.mode === 'exam';
  const locked = !exam && it.done, multi = q.a.length > 1;
  const optHtml = it.order.map((oi, pos) => {
    const pk = it.sel.includes(oi), ans = q.a.includes(oi); let cls = 'opt';
    if (pk) cls += ' sel';
    if (locked) { cls += ' lock'; if (ans) cls += ' ok'; else if (pk) cls += ' bad'; }
    return `<button class="${cls}" data-act="pick" data-oi="${oi}"><b>${String.fromCharCode(65 + pos)}</b><span>${esc(q.o[oi])}</span></button>`;
  }).join('');
  const answered = s.items.filter(i => i.sel.length).length;
  const grid = (exam || total <= 60) ? `<fieldset><legend>Danh sách câu</legend><div class="qn">${s.items.map((x, i) => {
    let c = i === s.idx ? 'cur ' : ''; if (!exam && x.done) c += x.ok ? 'ok' : 'bad'; else if (x.sel.length) c += 'ans';
    return `<button class="${c}" data-act="jump" data-i="${i}">${i + 1}</button>`;
  }).join('')}</div></fieldset>` : '';
  const last = s.idx === total - 1;
  return `<div class="bar"><i style="width:${Math.round((s.idx + 1) * 100 / total)}%"></i></div>
  <div class="qmeta"><span><b>Câu ${s.idx + 1}/${total}</b> <span class="tag">${esc(q.g)}</span></span><span id="timer"></span></div>
  <div class="card"><div class="qt">${esc(q.q)}</div>
    ${multi ? `<div class="hint">Câu này có ${q.a.length} đáp án đúng — chọn tất cả${!exam ? ' rồi bấm “Kiểm tra”' : ''}.</div>` : '<div class="hint">Chọn một đáp án.</div>'}
    ${optHtml}
    ${locked && q.e ? `<div class="expl"><b>Giải thích:</b> ${esc(q.e)}</div>` : ''}
    ${locked ? `<div class="hint" style="margin:10px 0 0;font-weight:600;color:${it.ok ? 'var(--ok)' : 'var(--bad)'}">${it.ok ? 'Chính xác!' : 'Chưa đúng.'}</div>` : ''}
  </div>
  <div class="actions">
    <button class="btn ghost ${s.idx === 0 ? 'off' : ''}" data-act="prev">‹ Trước</button>
    ${!exam && multi && !it.done ? '<button class="btn" data-act="check">Kiểm tra</button>' : ''}
    ${last ? '' : `<button class="btn ${!exam && !it.done && !it.sel.length ? 'ghost' : ''}" data-act="next">Tiếp ›</button>`}
    <span class="sp"></span>
    <button class="btn ${exam || last ? '' : 'ghost'}" data-act="finish" data-ans="${answered}">${exam ? 'Nộp bài' : 'Kết thúc'}</button>
  </div>${grid}`;
}
function startTimer(){
  clearInterval(timerId);
  if (S.view !== 'quiz' || !S.session) return;
  let tick = 0;
  const upd = () => {
    const s = S.session; if (!s) return;
    const el = Math.floor(elapsedNow()), t = $('#timer');
    if (s.limit) {
      const left = s.limit - el;
      if (t) { t.textContent = '⏱ ' + fmt(left); t.classList.toggle('late', left <= 60); }
      if (left <= 0) { clearInterval(timerId); toast('Hết giờ! Bài đã được nộp.'); finish(); return; }
    } else if (t) t.textContent = '⏱ ' + fmt(el);
    if (++tick % 10 === 0) persistSession();
  };
  upd(); timerId = setInterval(upd, 1000);
}
function reviewItem(q, sel, order, mark){
  const ord = order || q.o.map((_, i) => i), cls = mark === undefined ? '' : (mark ? 'ok' : 'bad');
  return `<details class="rv ${cls}"><summary><span class="tag">${esc(q.g)}</span><span class="rq">${esc(q.q)}</span></summary><div class="rvb">${ord.map((oi, pos) => {
    const a = q.a.includes(oi), p = sel.includes(oi);
    return `<div class="ro ${a ? 'ok' : ''} ${p && !a ? 'bad' : ''}"><b>${String.fromCharCode(65 + pos)}</b><span>${esc(q.o[oi])}</span>${a ? '<em>Đáp án đúng</em>' : ''}${p ? '<em>Bạn chọn</em>' : ''}</div>`;
  }).join('')}${mark === false && !sel.length ? '<div class="muted" style="margin-top:6px">Bạn chưa trả lời câu này.</div>' : ''}${q.e ? `<div class="expl"><b>Giải thích:</b> ${esc(q.e)}</div>` : ''}</div></details>`;
}

function viewReview(b){

/* ====================== Sự kiện ====================== */
function reviewStart(qs){ const b = bank(); if (S.session && !confirm('Đang có một bài làm dở. Bắt đầu bài mới sẽ xóa bài đó. Tiếp tục?')) return; startSession(b, qs, { mode: 'practice' }); }
function wrongQs(b){ const m = st(b); return b.qs.filter(q => m[q.id] && m[q.id].last === 0); }
function act(a, el){
  const b = bank(), d = el.dataset;
  switch (a) {
    case 'go': return go(['practice','exam'].includes(d.v) ? 'setup' : d.v, ['practice','exam'].includes(d.v) ? d.v : undefined);
    case 'resume': S.session.t0 = Date.now(); S.view = 'quiz'; return render();
    case 'drop': if (confirm('Bỏ bài đang làm dở?')) { clearSession(); render(); } return;
    case 'start': return startFromSetup();
    case 'grpall': case 'grpnone': document.querySelectorAll('[data-grp]').forEach(x => x.checked = a === 'grpall'); S.cfg.sel[b.id] = a === 'grpall' ? null : []; if (a === 'grpall') delete S.cfg.sel[b.id]; saveCfg(); return updAvail();
    case 'pick': return pick(Number(d.oi));
    case 'check': return check();
    case 'prev': return move(-1);
    case 'next': return move(1);
    case 'jump': return jump(Number(d.i));
    case 'finish': {
      const s = S.session, un = s.items.filter(i => !i.sel.length).length;
      if (un && !confirm(`Còn ${un} câu chưa trả lời. ${s.mode === 'exam' ? 'Nộp bài' : 'Kết thúc'} ngay?`)) return;
      return finish();
    }
    case 'retry': { const bb = getBank(S.result.bank); const qs = S.result.rows.filter(x => !x.ok).map(x => qOf(bb, x.id)); S.active = bb.id; return startSession(bb, qs, { mode: 'practice' }); }
    case 'toggleall': S.showAll = !S.showAll; return render();
    case 'rvall': return reviewStart(wrongQs(b));
    case 'rvgroup': return reviewStart(wrongQs(b).filter(q => q.g === d.g));
    case 'rvclear': if (confirm('Xóa danh sách câu cần ôn? (Lịch sử làm bài vẫn được giữ.)')) { const m = st(b); Object.values(m).forEach(r => { if (r.last === 0) r.last = null; }); LS.set('stats', S.stats); render(); } return;
    case 'clearhist': if (confirm('Xóa toàn bộ lịch sử làm bài?')) { S.history = []; LS.set('history', []); render(); } return;
    case 'pickfile': return $('#file').click();
    case 'template': return downloadTemplate();
    case 'use': S.active = d.id; LS.set('active', d.id); toast('Đã chuyển bộ câu hỏi.'); return render();
    case 'delbank': {
      const t = getBank(d.id); if (!t || !confirm(`Xóa bộ "${t.name}" và tiến trình của bộ này?`)) return;
      S.banks = S.banks.filter(x => x.id !== d.id); delete S.stats[d.id]; LS.set('banks', S.banks); LS.set('stats', S.stats);
      if (S.session && S.session.bank === d.id) clearSession();
      if (S.active === d.id) { S.active = null; LS.del('active'); }
      return render();
    }
    case 'resetprog': if (confirm('Xóa toàn bộ tiến trình của bộ câu hỏi đang dùng?')) { S.stats[b.id] = {}; LS.set('stats', S.stats); toast('Đã xóa tiến trình.'); render(); } return;
    case 'backup': {
      const blob = new Blob([JSON.stringify({ v: 1, banks: S.banks, stats: S.stats, history: S.history })], { type: 'application/json' });
      const a2 = document.createElement('a'); a2.href = URL.createObjectURL(blob); a2.download = 'quiz-backup-' + new Date().toISOString().slice(0, 10) + '.json'; a2.click(); setTimeout(() => URL.revokeObjectURL(a2.href), 2000); return;
    }
    case 'restore': return $('#restore').click();
  }
}
$('#app').addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el) act(el.dataset.act, el); });
$('#nav').addEventListener('click', e => { const el = e.target.closest('[data-nav]'); if (!el) return; const k = el.dataset.nav; ['practice','exam'].includes(k) ? go('setup', k) : go(k); });
$('#pill').addEventListener('click', () => go('banks'));
$('#app').addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.cfg) { const k = t.dataset.cfg; S.cfg[k] = t.type === 'checkbox' ? t.checked : (k === 'filter' ? t.value : Number(t.value)); saveCfg(); updAvail(); }
  else if (t.dataset.grp !== undefined) { const b = bank(); S.cfg.sel[b.id] = [...document.querySelectorAll('[data-grp]')].filter(x => x.checked).map(x => x.dataset.grp); saveCfg(); updAvail(); }
});
$('#file').addEventListener('change', async e => { const f = e.target.files[0]; e.target.value = ''; if (f) await importFile(f); });
$('#restore').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || typeof d !== 'object' || !Array.isArray(d.banks) || typeof d.stats !== 'object') throw 0;
    if (!confirm('Khôi phục sẽ thay thế toàn bộ bộ câu hỏi đã nhập, tiến trình và lịch sử hiện tại. Tiếp tục?')) return;
    S.banks = d.banks; S.stats = d.stats; S.history = Array.isArray(d.history) ? d.history : [];
    LS.set('banks', S.banks); LS.set('stats', S.stats); LS.set('history', S.history); clearSession(); S.active = null; LS.del('active');
    toast('Đã khôi phục tiến trình.'); render();
  } catch { toast('File sao lưu không hợp lệ.'); }
});
document.addEventListener('keydown', e => {
  if (S.view !== 'quiz' || !S.session || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName || '')) return;
  const { s, it } = curItem(), k = e.key.toUpperCase();
  if (/^[A-H1-8]$/.test(k)) { const pos = /\d/.test(k) ? Number(k) - 1 : k.charCodeAt(0) - 65; if (pos < it.order.length) pick(it.order[pos]); }
  else if (e.key === 'Enter') { e.preventDefault(); if (s.mode === 'practice' && !it.done && it.sel.length) check(); else move(1); }
  else if (e.key === 'ArrowRight') move(1);
  else if (e.key === 'ArrowLeft') move(-1);
});
document.addEventListener('visibilitychange', () => { if (document.hidden && S.view === 'quiz' && S.session) persistSession(); });

/* ====================== Khởi động ====================== */
(async function init(){
  await loadRepo();
  if (!S.active && S.repo) S.active = 'repo';
  validateSession();
  render();
})();
</script>
